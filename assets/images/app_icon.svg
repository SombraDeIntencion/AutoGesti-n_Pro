<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#17A2B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>
  
  <!-- Ícono de auto simplificado y moderno -->
  <g transform="translate(512, 512)">
    <!-- Carrocería del auto -->
    <path d="M -220,-80 L -180,-160 L 180,-160 L 220,-80 L 220,80 L -220,80 Z" 
          fill="url(#carGradient)" 
          stroke="#0088CC" 
          stroke-width="8"/>
    
    <!-- Ventanas -->
    <rect x="-160" y="-140" width="120" height="50" rx="8" fill="#0088CC" opacity="0.3"/>
    <rect x="40" y="-140" width="120" height="50" rx="8" fill="#0088CC" opacity="0.3"/>
    
    <!-- Ruedas -->
    <circle cx="-140" cy="80" r="50" fill="#1F2937"/>
    <circle cx="-140" cy="80" r="30" fill="#6B7280"/>
    <circle cx="140" cy="80" r="50" fill="#1F2937"/>
    <circle cx="140" cy="80" r="30" fill="#6B7280"/>
    
    <!-- Faro -->
    <circle cx="-200" cy="-20" r="15" fill="#FFD700"/>
    <circle cx="200" cy="-20" r="15" fill="#FFD700"/>
    
    <!-- Parrilla -->
    <rect x="-200" y="-40" width="30" height="40" rx="4" fill="#00BFA5"/>
    
    <!-- Detalle naranja (acento) -->
    <path d="M -220,60 L 220,60 L 220,70 L -220,70 Z" fill="#FF9500"/>
  </g>
  
  <!-- Marca de agua sutil -->
  <text x="512" y="940" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#FFFFFF" 
        fill-opacity="0.3" 
        text-anchor="middle">MAX</text>
</svg>
